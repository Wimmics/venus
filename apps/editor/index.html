<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Venus Editor</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="./src/css/index.css" />
    <script type="module" src="./index.js"></script>
  </head>
  <body class="editor-body">
    <header class="w3-card editor-navbar">
      <div class="w3-content editor-navbar-inner">
        <div class="editor-brand">VENUS Editor</div>
        <div class="editor-navbar-actions">
          <div class="editor-examples-dropdown" id="examplesDropdown">
            <button
              type="button"
              class="editor-examples-button w3-button w3-hover-white"
              id="examplesDropdownButton"
              aria-haspopup="menu"
              aria-expanded="false"
            >
              <span class="editor-examples-button-title">Examples</span>
              <i class="bi bi-caret-down-fill" aria-hidden="true"></i>
            </button>
            <div class="editor-examples-menu w3-card" id="examplesDropdownMenu" role="menu" hidden></div>
            <select
              class="editor-examples-select-native"
              id="scenarioSelect"
              aria-label="Select an example"
              tabindex="-1"
            ></select>
          </div>
          <a class="w3-button w3-hover-white" href="/documentation/" target="_blank" rel="noreferrer">
            Documentation
          </a>
          <a class="w3-button w3-hover-white" href="https://github.com/wimmics/venus" target="_blank" rel="noreferrer">
            GitHub
          </a>
        </div>
      </div>
    </header>

    <div class="container-fluid editor-root">
      <section class="workspace-row" id="workspaceRow">
        <div class="workspace-pane workspace-pane-config d-flex" id="configPane">
          <article class="card shadow-sm flex-fill d-flex">
            <div class="card-header p-2">
              <ul class="nav nav-pills panel-tabs panel-tabs-fill m-0" id="configTabs" role="tablist">
                <li class="nav-item flex-fill" role="presentation">
                  <button
                    class="nav-link w-100"
                    id="sparql-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#sparql-pane"
                    type="button"
                    role="tab"
                    aria-controls="sparql-pane"
                    aria-selected="false"
                  >
                    SPARQL
                  </button>
                </li>
                <li class="nav-item flex-fill" role="presentation">
                  <button
                    class="nav-link active w-100"
                    id="encoding-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#encoding-pane"
                    type="button"
                    role="tab"
                    aria-controls="encoding-pane"
                    aria-selected="true"
                  >
                    Encoding
                  </button>
                </li>
              </ul>
            </div>
            <div class="card-body tab-content tab-content-fill flex-fill pt-2" id="configTabsContent">
              <div
                class="tab-pane fade h-100"
                id="sparql-pane"
                role="tabpanel"
                aria-labelledby="sparql-tab"
                tabindex="0"
              >
                <div class="sparql-pane-layout">
                  <div class="mb-2">
                    <label class="form-label fw-semibold mb-1" for="endpointInput">Endpoint</label>
                    <input
                      class="form-control form-control-sm"
                      id="endpointInput"
                      type="text"
                      placeholder="SPARQL endpoint URL"
                    />
                  </div>
                  <div class="sparql-query-block">
                    <label class="form-label fw-semibold mb-1" for="sparqlEditor">Query</label>
                    <div class="tab-editor-shell">
                      <div class="tab-toolbar d-flex justify-content-end gap-1" id="sparqlToolbar"></div>
                      <div class="code cm-panel h-100" id="sparqlEditor"></div>
                    </div>
                  </div>
                </div>
              </div>
              <div
                class="tab-pane fade show active h-100"
                id="encoding-pane"
                role="tabpanel"
                aria-labelledby="encoding-tab"
                tabindex="0"
              >
                <div class="tab-editor-shell">
                  <div class="tab-toolbar d-flex justify-content-end gap-1" id="encodingToolbar"></div>
                  <div class="editor cm-panel h-100" id="encodingEditor"></div>
                </div>
              </div>
            </div>
          </article>
        </div>

        <div
          class="workspace-splitter"
          id="splitterConfigData"
          role="separator"
          aria-orientation="vertical"
          aria-label="Resize Config and Data panels"
          tabindex="0"
        ></div>

        <div class="workspace-pane workspace-pane-data d-flex" id="dataPane">
          <article class="card shadow-sm flex-fill d-flex">
            <div class="card-header panel-header d-flex align-items-center justify-content-between gap-2 p-2">
              <ul class="nav nav-pills panel-tabs panel-tabs-single flex-grow-1 m-0" id="dataTabs" role="tablist">
                <li class="nav-item flex-fill" role="presentation">
                  <button class="nav-link active w-100" type="button" role="tab" aria-selected="true">
                    SPARQL Results
                  </button>
                </li>
              </ul>
              <div class="panel-header-options d-flex align-items-center gap-2">
                <button
                  class="btn btn-sm btn-outline-secondary"
                  id="toggleDataCompress"
                  type="button"
                  title="Compress or expand Results panel"
                  aria-label="Compress Results panel"
                >
                  <i class="bi bi-arrows-collapse-vertical" aria-hidden="true"></i>
                </button>
              </div>
            </div>
            <div class="card-body d-flex flex-column min-h-0">
              <div class="results-controls-row d-flex justify-content-end align-items-center mb-2">
                <div class="form-check form-switch m-0">
                  <input class="form-check-input" type="checkbox" role="switch" id="resultsAsSourceToggle" />
                  <label class="form-check-label small fw-semibold" for="resultsAsSourceToggle">
                    Use As Source
                  </label>
                </div>
              </div>
              <div class="tab-editor-shell">
                <div class="tab-toolbar d-flex justify-content-end gap-1" id="resultsToolbar"></div>
                <div class="code cm-panel h-100" id="sparqlResults"></div>
              </div>
            </div>
          </article>
          <div class="pane-collapsed-bar" id="dataPaneCollapsedBar" aria-hidden="true">
            <button
              class="btn btn-sm btn-outline-secondary"
              id="toggleDataExpand"
              type="button"
              title="Expand Results panel"
              aria-label="Expand Results panel"
            >
              <i class="bi bi-arrows-expand-vertical" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <div
          class="workspace-splitter"
          id="splitterDataResult"
          role="separator"
          aria-orientation="vertical"
          aria-label="Resize Data and Result panels"
          tabindex="0"
        ></div>

        <div class="workspace-pane workspace-pane-result d-flex" id="resultPane">
          <article class="card shadow-sm flex-fill d-flex">
            <div class="card-header p-2">
              <ul class="nav nav-pills panel-tabs panel-tabs-fill m-0" id="resultTabs" role="tablist">
                <li class="nav-item flex-fill" role="presentation">
                  <button
                    class="nav-link active w-100"
                    id="visualization-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#visualization-pane"
                    type="button"
                    role="tab"
                    aria-controls="visualization-pane"
                    aria-selected="true"
                  >
                    Preview
                  </button>
                </li>
                <li class="nav-item flex-fill" role="presentation">
                  <button
                    class="nav-link w-100"
                    id="integration-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#integration-pane"
                    type="button"
                    role="tab"
                    aria-controls="integration-pane"
                    aria-selected="false"
                  >
                   Integration <i class="bi bi-box-arrow-up-right me-1" aria-hidden="true"></i>
                  </button>
                </li>
              </ul>
            </div>
            <div class="card-body tab-content tab-content-fill flex-fill pt-2" id="resultTabsContent">
              <div
                class="tab-pane fade show active h-100"
                id="visualization-pane"
                role="tabpanel"
                aria-labelledby="visualization-tab"
                tabindex="0"
              >
                <div class="visualization-shell">
                  <div class="tab-toolbar d-flex justify-content-end gap-1" id="visualizationToolbar">
                    <div class="editor-export-dropdown" id="exportDropdown">
                      <button
                        class="btn btn-sm btn-outline-secondary editor-export-button"
                        id="exportDropdownButton"
                        type="button"
                        aria-haspopup="menu"
                        aria-expanded="false"
                        title="Download visualization"
                        aria-label="Download visualization"
                      >
                        <i class="bi bi-download" aria-hidden="true"></i>
                      </button>
                      <div class="editor-export-menu w3-card" id="exportDropdownMenu" role="menu" hidden>
                        <button type="button" class="editor-export-option" data-format="png" role="menuitem">PNG</button>
                        <button type="button" class="editor-export-option" data-format="jpg" role="menuitem">JPG</button>
                        <button type="button" class="editor-export-option" data-format="pdf" role="menuitem">PDF</button>
                        <button type="button" class="editor-export-option" data-format="svg" role="menuitem">SVG</button>
                      </div>
                    </div>
                  </div>
                  <div id="visualizationHost" class="visualization-host"></div>
                  <vis-uri-meta id="metaPanel" width="900" height="600"></vis-uri-meta>
                </div>
              </div>
              <div
                class="tab-pane fade h-100"
                id="integration-pane"
                role="tabpanel"
                aria-labelledby="integration-tab"
                tabindex="0"
              >
                <div class="tab-editor-shell">
                  <div class="tab-toolbar d-flex justify-content-end gap-1" id="snippetToolbar"></div>
                  <div class="code cm-panel h-100" id="generatedCode"></div>
                </div>
              </div>
            </div>
          </article>
        </div>
      </section>
    </div>
    <footer class="w3-container w3-white w3-center w3-padding-16 editor-footer">
      <div class="footer-logos">
        <a href="https://www.inria.fr/en" target="_blank" rel="noreferrer">
          <img src="./assets/logos/inria.png" alt="Inria logo" />
        </a>
        <a href="https://www.cnrs.fr/fr" target="_blank" rel="noreferrer">
          <img src="./assets/logos/cnrs.png" alt="CNRS logo" />
        </a>
        <a href="https://univ-cotedazur.fr/en" target="_blank" rel="noreferrer">
          <img src="./assets/logos/uca.png" alt="Universite Cote d'Azur logo" />
        </a>
        <a href="https://www.i3s.unice.fr/en" target="_blank" rel="noreferrer">
          <img src="./assets/logos/i3s.png" alt="I3S logo" />
        </a>
        <a href="https://www.wimmics.inria.fr/" target="_blank" rel="noreferrer">
          <img src="./assets/logos/wimmics.png" alt="Wimmics logo" />
        </a>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
