<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Playground</title>
    <script type="module" src="./index.js"></script>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: Arial, sans-serif;
        background: #f7f7f7;
      }

      .playground {
        display: grid;
        gap: 16px;
      }

      .controls {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 12px;
        display: grid;
        gap: 10px;
      }

      .controls-row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }

      label {
        font-weight: 700;
      }

      select,
      button {
        border: 1px solid #bbb;
        border-radius: 6px;
        padding: 8px 10px;
        font-size: 14px;
        background: #fff;
      }

      button {
        cursor: pointer;
      }

      .scenario-description {
        font-size: 14px;
        color: #333;
      }

      .status {
        font-size: 13px;
        color: #555;
      }

      .status.error {
        color: #a10000;
      }

      vis-graph {
        display: block;
      }
    </style>
  </head>

  <body>
    <div class="playground">
      <div class="controls">
        <div class="controls-row">
          <label for="scenarioSelect">Test Scenario</label>
          <select id="scenarioSelect"></select>
          <button id="reloadScenario" type="button">Reload Scenario</button>
        </div>
        <div id="scenarioDescription" class="scenario-description"></div>
        <div id="status" class="status"></div>
      </div>

      <vis-graph id="myGraph" width="100%" height="100%"></vis-graph>
      <vis-barchart id="myBarChart" width="100%" height="100%" style="display:none;"></vis-barchart>
      <vis-uri-meta id="metaPanel" width="900" height="600"></vis-uri-meta>
    </div>

    <script>
      const SCENARIO_INDEX_PATH = "./test/encoding/scenarios.index.json";
      const SCENARIO_STORAGE_KEY = "kgnovis.playground.selectedScenarioId";

      async function fetchJson(path) {
        const response = await fetch(path);
        if (!response.ok) {
          throw new Error(`Failed to load JSON at ${path} (${response.status})`);
        }
        return response.json();
      }

      async function fetchText(path) {
        const response = await fetch(path);
        if (!response.ok) {
          throw new Error(`Failed to load query at ${path} (${response.status})`);
        }
        return response.text();
      }

      function setStatus(message, isError = false) {
        const statusEl = document.getElementById("status");
        statusEl.textContent = message;
        statusEl.classList.toggle("error", isError);
      }

      function setScenarioDescription(text) {
        document.getElementById("scenarioDescription").textContent = text || "";
      }

      async function loadScenarioCatalog() {
        const index = await fetchJson(SCENARIO_INDEX_PATH);
        const entries = Array.isArray(index.scenarios) ? index.scenarios : [];

        const configs = await Promise.all(
          entries.map(async (entry) => {
            const config = await fetchJson(entry.configPath);
            return {
              id: entry.id,
              configPath: entry.configPath,
              ...config
            };
          })
        );

        return {
          defaultScenarioId: index.defaultScenarioId,
          scenarios: configs
        };
      }

      function populateScenarioDropdown(scenarios, defaultScenarioId) {
        const select = document.getElementById("scenarioSelect");
        select.innerHTML = "";

        for (const scenario of scenarios) {
          const option = document.createElement("option");
          option.value = scenario.id;
          option.textContent = scenario.name || scenario.id;
          select.appendChild(option);
        }

        const savedScenarioId = sessionStorage.getItem(SCENARIO_STORAGE_KEY);
        const savedExists = scenarios.some((scenario) => scenario.id === savedScenarioId);
        const defaultExists = scenarios.some((scenario) => scenario.id === defaultScenarioId);
        const selectedScenarioId = savedExists
          ? savedScenarioId
          : (defaultExists ? defaultScenarioId : (scenarios[0]?.id || ""));
        select.value = selectedScenarioId;
        if (selectedScenarioId) {
          sessionStorage.setItem(SCENARIO_STORAGE_KEY, selectedScenarioId);
        }
      }

      async function applyScenario(graph, barChart, metaPanel, scenario) {
        setStatus(`Loading scenario: ${scenario.name || scenario.id}...`);
        setScenarioDescription(scenario.description || "");

        const queryText = await fetchText(scenario.queryPath);
        const visType = scenario.visType || "force-graph";

        graph.style.display = visType === "bar-chart" ? "none" : "block";
        barChart.style.display = visType === "bar-chart" ? "block" : "none";

        if (visType === "bar-chart") {
          barChart.sparqlEndpoint = scenario.endpoint;
          barChart.sparqlQuery = queryText;
          barChart.encoding = scenario.encoding;
          await barChart.launch();
        } else {
          graph.nodeDetailsPanel = metaPanel;
          graph.sparqlEndpoint = scenario.endpoint;
          graph.sparqlQuery = queryText;
          graph.encoding = scenario.encoding;

          await graph.launch();
        }

        setStatus(`Loaded: ${scenario.name || scenario.id}`);
      }

      async function initPlayground() {
        const graph = document.getElementById("myGraph");
        const barChart = document.getElementById("myBarChart");
        const metaPanel = document.getElementById("metaPanel");
        const select = document.getElementById("scenarioSelect");
        const reloadButton = document.getElementById("reloadScenario");

        try {
          const catalog = await loadScenarioCatalog();
          const scenariosById = new Map(catalog.scenarios.map((scenario) => [scenario.id, scenario]));

          if (!catalog.scenarios.length) {
            setStatus("No scenario found in test/encoding/scenarios.index.json", true);
            return;
          }

          populateScenarioDropdown(catalog.scenarios, catalog.defaultScenarioId);

          const runSelectedScenario = async () => {
            const selectedScenario = scenariosById.get(select.value);
            if (!selectedScenario) {
              setStatus(`Unknown scenario: ${select.value}`, true);
              return;
            }
            sessionStorage.setItem(SCENARIO_STORAGE_KEY, selectedScenario.id);

            try {
              await applyScenario(graph, barChart, metaPanel, selectedScenario);
            } catch (error) {
              console.error(error);
              setStatus(error.message || "Failed to load scenario", true);
            }
          };

          select.addEventListener("change", runSelectedScenario);
          reloadButton.addEventListener("click", runSelectedScenario);

          await runSelectedScenario();
        } catch (error) {
          console.error(error);
          setStatus(error.message || "Failed to initialize playground", true);
        }
      }

      window.addEventListener("DOMContentLoaded", initPlayground);
    </script>
  </body>
</html>
