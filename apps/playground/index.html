<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Playground</title>

    <script type="module" src="./index.js"></script>
  </head>

  <body>
        <!-- Add the component to your page -->
     <vis-graph id="myGraph" width="800" height="600"></vis-graph>

     <vis-uri-meta width="800" height="600"></vis-uri-meta>

    <script>

      async function configGraph() {
        const graph = document.getElementById("myGraph");
        console.log(graph)
        // 1. Configure the component properties
        graph.sparqlEndpoint = 'https://query.wikidata.org/sparql';
        graph.sparqlQuery = `
            SELECT ?species ?speciesLabel ?family ?familyLabel ?articleCount WHERE {
    ?species wdt:P171* wd:Q25265 .   # Felidae descendant
    ?species wdt:P105 wd:Q7432 .     # taxon rank = species

    ?species wdt:P171* ?family .
    ?family wdt:P105 wd:Q35409 .     # taxon rank = family

    ?species wikibase:sitelinks ?articleCount .

    SERVICE wikibase:label {
      bd:serviceParam wikibase:language "[AUTO_LANGUAGE],en".
    }
  }
  ORDER BY DESC(?articleCount)
  LIMIT 100


            `;

          graph.nodeDetailsPanel = document.querySelector('vis-uri-meta')
        
        // Optional: configure a proxy if your endpoint has CORS issues
        // graph.proxy = 'http://localhost:3001/sparql-proxy';

        // Configure custom visual encoding
        graph.encoding = {
          nodes: {
            field: ["species", "family"],
            color: [
              { field: "speciesLabel", scale: { type: "ordinal", range: "red" }, label: "Species Label" },
              { field: "familyLabel",  scale: { type: "ordinal", range: "yellow" }, label: "Family Label" }
            ],
            size: {
              field: "articleCount",
              scale: {
                type: "sqrt",      // linear | sqrt | log | ordinal
                //domain: [0, 250],     // optional (auto-computed if omitted)
                range: [5, 20],       // radius range in px
                binning: { method: "quartile", bins: 5 } // optional
              },
              value: 10,             // optional fallback radius
              legend: { title: "Node Size" }, // optional title
              label: "Node Size"     // optional alternative title
            }
          },
          links: {
            field: {source: "species", target: "family"},
            color: [
              { field: "type", scale: { type: "ordinal", range: ["#999", "#f66"] } }
            ]
          }
        };

        // 2. Launch the visualization
        graph.launch()
      }

      async function configMetaPanel() {
        const panel = document.querySelector('vis-uri-meta')

        panel.node = { uri: "http://www.wikidata.org/entity/Q25265" }
        panel.sparqlEndpoint = "https://query.wikidata.org/sparql"

        await panel.load()
      }

      window.addEventListener("DOMContentLoaded", async () => {
          await configGraph()

      });
    
    </script>

  </body>

</html>
